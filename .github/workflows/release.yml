# Creates a GitHub Release for each version tag (v0.21, v0.22…), with notes listing the commits since the last one.
# The tag must match the version shown in index.html.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version of index.html
        run: |
          shown=$(grep -o '<span class="version">v[0-9.]*</span>' index.html | grep -o 'v[0-9.]*')
          if [ "$shown" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but index.html shows $shown"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
