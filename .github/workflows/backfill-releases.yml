# One-time workflow: creates the tags and releases of the versions published before the release workflow.
# Run it once from the Actions tab, then delete this file.
name: Backfill releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r version commit; do
            if git rev-parse --verify --quiet "refs/tags/$version" > /dev/null; then continue; fi
            gh release create "$version" --target "$commit" --title "$version" --notes "$(git log -1 --format=%B "$commit")"
          done << 'LIST'
          v0.12 fe99d0d
          v0.13 e808513
          v0.14 acc65d5
          v0.15 d28d144
          v0.16 ec828f7
          v0.17 d79dca9
          v0.18 259d535
          v0.19 6f05164
          v0.20 ea2cccd
          v0.21 ed05521
          LIST
